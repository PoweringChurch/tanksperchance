
<style>
  :root {
    --font-sans: 'Inter', 'Segoe UI', 'Roboto', sans-serif;
    --font-mono: 'Fira Mono', 'Consolas', monospace;

    --color-background-primary: #1e1e2f;
    --color-background-secondary: #2a2a3f;
    --color-border-primary: #3a3a5a;
    --color-border-secondary: #4a4a6a;
    --color-border-tertiary: #5a5a7a;

    --color-text-primary: #e0e0e0;
    --color-text-secondary: #b0b0c0;
    --color-text-tertiary: #808090;
    --color-text-danger: #ff6b6b;
    --color-background-warning: #5a4a2a;
    --color-text-warning: #f0d080;

    --color-background-info: #3a4a6a;
    --color-text-info: #a0c0ff;

    --border-radius-md: 4px;
    --border-radius-lg: 8px;
  }
  body {
    background: var(--color-background-primary);
    font-family: var(--font-sans);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #app { font-family: var(--font-sans); color: var(--color-text-primary); display: flex; flex-direction: column; gap: 0; min-height: 600px; padding: 12px 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); flex-wrap: wrap; }
  .toolbar-group { display: flex; align-items: center; gap: 6px; }
  .toolbar-sep { width: 0.5px; height: 24px; background: var(--color-border-tertiary); }
  .toolbar label { font-size: 12px; color: var(--color-text-secondary); }
  .toolbar input[type=text], .toolbar input[type=number] { font-size: 12px; height: 28px; padding: 0 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); width: 90px; }
  .toolbar input[type=number] { width: 52px; }
  .btn { font-size: 12px; font-family: var(--font-sans); height: 28px; padding: 0 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn.danger { color: var(--color-text-danger); border-color: var(--color-border-danger); }
  .btn.danger:hover { background: var(--color-background-danger); }
  .editor-layout { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
  .palette { width: 152px; flex-shrink: 0; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); padding: 8px; display: flex; flex-direction: column; gap: 3px; }
  .palette-title { font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 4px; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 2px; }
  .palette-category { font-size: 10px; color: var(--color-text-tertiary); margin-top: 5px; margin-bottom: 1px; }
  .asset-btn { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: var(--border-radius-md); border: 1.5px solid transparent; cursor: pointer; background: none; color: var(--color-text-primary); font-size: 12px; font-family: var(--font-sans); width: 100%; text-align: left; }
  .asset-btn:hover { background: var(--color-background-primary); }
  .asset-btn.selected { border-color: var(--color-border-info); background: var(--color-background-info); color: var(--color-text-info); }
  .asset-icon { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; font-weight: 700; }
  .tool-sep { margin: 4px 0; border: none; border-top: 0.5px solid var(--color-border-tertiary); }
  .tool-row { display: flex; gap: 4px; }
  .tool-btn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .tool-btn:hover { background: var(--color-background-primary); color: var(--color-text-primary); }
  .tool-btn.selected { border-color: var(--color-border-info); background: var(--color-background-info); color: var(--color-text-info); }
  .canvas-wrap { flex: 1; overflow: auto; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); min-height: 400px; }
  #grid-canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
  .status-bar { display: flex; align-items: center; gap: 12px; padding: 5px 10px; font-size: 11px; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); margin-top: 8px; }
  .status-bar span { display: flex; align-items: center; gap: 4px; }
  .prop-panel { margin-top: 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); padding: 8px 12px; display: none; align-items: center; gap: 10px; font-size: 12px; }
  .prop-panel.visible { display: flex; }
  .prop-panel label { color: var(--color-text-secondary); white-space: nowrap; }
  .prop-panel input[type=number] { font-size: 12px; height: 28px; padding: 0 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); width: 80px; }
  .prop-badge { font-size: 11px; padding: 2px 8px; border-radius: var(--border-radius-md); background: var(--color-background-warning); color: var(--color-text-warning); font-weight: 500; }
  .modal-bg { display: flex; align-items: center; justify-content: center; min-height: 320px; }
  .modal { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 20px; width: 460px; max-width: 96%; display: flex; flex-direction: column; gap: 12px; }
  .modal h3 { font-size: 15px; font-weight: 500; }
  .modal textarea { width: 100%; height: 220px; font-family: var(--font-mono); font-size: 11px; padding: 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); resize: vertical; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-primary { font-size: 12px; font-family: var(--font-sans); height: 28px; padding: 0 14px; border: none; border-radius: var(--border-radius-md); background: var(--color-text-primary); color: var(--color-background-primary); cursor: pointer; }
  .btn-primary:hover { opacity: 0.85; }
  .error-msg { font-size: 12px; color: var(--color-text-danger); }
</style>

<div id="app">
  <div class="toolbar">
    <div class="toolbar-group">
      <label>Level name</label>
      <input type="text" id="level-name" value="level_01" />
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <label>W</label>
      <input type="number" id="grid-w" value="20" min="4" max="64" />
      <label>H</label>
      <input type="number" id="grid-h" value="16" min="4" max="64" />
      <button class="btn" id="btn-resize"><i class="ti ti-layout-grid" aria-hidden="true"></i> Resize</button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="btn" id="btn-export"><i class="ti ti-download" aria-hidden="true"></i> Export JSON</button>
      <button class="btn" id="btn-import"><i class="ti ti-upload" aria-hidden="true"></i> Import JSON</button>
      <button class="btn danger" id="btn-clear"><i class="ti ti-trash" aria-hidden="true"></i> Clear</button>
    </div>
  </div>

  <div class="editor-layout">
    <div class="palette">
      <div class="palette-title">Tools</div>
      <div class="tool-row">
        <button class="tool-btn selected" id="tool-draw" title="Draw (1)">PN</button>
        <button class="tool-btn" id="tool-erase" title="Erase (2)">ER</button>
        <button class="tool-btn" id="tool-fill" title="Fill (3)">FI</button>
        <button class="tool-btn" id="tool-pick" title="Eyedropper (4)">EY</button>
      </div>
      <hr class="tool-sep" />
      <div class="palette-title" style="margin-top:4px">Assets</div>

      <div class="palette-category">Terrain</div>
      <button class="asset-btn selected" data-id="wall"><span class="asset-icon" style="background:#4a4a5a;color:#aaaacc;">▪</span>Wall</button>
      <button class="asset-btn" data-id="breakable_wall"><span class="asset-icon" style="background:#5a4a2a;color:#c8a96e;">▪</span>Breakable</button>
      <button class="asset-btn" data-id="water"><span class="asset-icon" style="background:#1a3a5a;color:#4a9ad4;">≈</span>Water</button>
      <button class="asset-btn" data-id="bush"><span class="asset-icon" style="background:#1a3a1a;color:#4aff4a;">♣</span>Bush</button>

      <div class="palette-category">Enemies</div>
      <button class="asset-btn" data-id="green_enemy"><span class="asset-icon" style="background:#1a3a1a;color:#4aff4a;">▲</span>Green</button>
      <button class="asset-btn" data-id="grey_enemy"><span class="asset-icon" style="background:#3a3a3a;color:#aaaaaa;">▲</span>Grey</button>
      <button class="asset-btn" data-id="pink_enemy"><span class="asset-icon" style="background:#3a1a2a;color:#ff88bb;">▲</span>Pink</button>
      <button class="asset-btn" data-id="brown_enemy"><span class="asset-icon" style="background:#49463c;color:#ceb97b;">▲</span>Brown</button>

      <div class="palette-category">Special</div>
      <button class="asset-btn" data-id="player_spawn"><span class="asset-icon" style="background:#1a2a4a;color:#44ccff;">◈</span>Player spawn</button>
      <button class="asset-btn" data-id="objective"><span class="asset-icon" style="background:#2a1a3a;color:#cc88ff;">★</span>Objective</button>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; gap:0;">
      <div class="canvas-wrap">
        <canvas id="grid-canvas"></canvas>
      </div>

      <div class="prop-panel" id="prop-panel">
        <span class="prop-badge">Objective</span>
        <label for="prop-data">data value</label>
        <input type="number" id="prop-data" value="0" step="1" />
        <span style="color:var(--color-text-tertiary); font-size:11px;">applied to next objective placed</span>
      </div>

      <div id="modal-export" style="display:none;">
        <div class="modal-bg">
          <div class="modal">
            <h3>Export level JSON</h3>
            <textarea id="export-text" readonly></textarea>
            <div class="modal-btns">
              <button class="btn" id="btn-copy-json"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>
              <button class="btn-primary" id="btn-export-close">Done</button>
            </div>
          </div>
        </div>
      </div>

      <div id="modal-import" style="display:none;">
        <div class="modal-bg">
          <div class="modal">
            <h3>Import level JSON</h3>
            <textarea id="import-text" placeholder="Paste JSON here..."></textarea>
            <div id="import-error" class="error-msg"></div>
            <div class="modal-btns">
              <button class="btn" id="btn-import-cancel">Cancel</button>
              <button class="btn-primary" id="btn-import-load">Load</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-pos"><i class="ti ti-map-pin" style="font-size:13px" aria-hidden="true"></i> —</span>
    <span id="status-tool"><i class="ti ti-pencil" style="font-size:13px" aria-hidden="true"></i> Draw</span>
    <span id="status-asset"><i class="ti ti-box" style="font-size:13px" aria-hidden="true"></i> wall</span>
    <span id="status-count" style="margin-left:auto"><i class="ti ti-stack" style="font-size:13px" aria-hidden="true"></i> 0 objects</span>
  </div>
</div>

<script>
const TILE = 28;

const ASSET_DEF = {
  wall:           { bg: '#4a4a5a', fg: '#aaaacc', label: '▪' },
  breakable_wall: { bg: '#5a4a2a', fg: '#c8a96e', label: '▪', cracks: true },
  water:          { bg: '#1a3a5a', fg: '#4a9ad4', label: '≈' },
  bush:           { bg: '#1a3a1a', fg: '#4aff4a', label: '♣' },
  green_enemy:    { bg: '#1a3a1a', fg: '#4aff4a', label: '▲' },
  grey_enemy:     { bg: '#3a3a3a', fg: '#aaaaaa', label: '▲' },
  brown_enemy:    { bg: '#49463c', fg: '#ceb97b', label: '▲' },
  pink_enemy:     { bg: '#3a1a2a', fg: '#ff88bb', label: '▲' },
  player_spawn:   { bg: '#1a2a4a', fg: '#44ccff', label: '◈' },
  objective:      { bg: '#2a1a3a', fg: '#cc88ff', label: '★' },
  
};

let gridW = 20, gridH = 16;
let cells = {};
let selectedAsset = 'wall';
let activeTool = 'draw';
let isPainting = false;
let hoverCell = null;
let objectiveDataValue = 0;

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

function cellKey(x, y) { return `${x},${y}`; }

function initCanvas() {
  canvas.width = gridW * TILE;
  canvas.height = gridH * TILE;
  draw();
}

function draw() {
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  ctx.fillStyle = '#1e1e2f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const gridLine = '#3a3a5a';

  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const k = cellKey(x, y);
      const px = x * TILE, py = y * TILE;
      const cell = cells[k];

      if (cell) {
        const a = ASSET_DEF[cell.asset_id];
        if (a) {
          ctx.fillStyle = a.bg;
          ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
          if (a.cracks) {
            ctx.strokeStyle = '#88663a'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px+6, py+2); ctx.lineTo(px+10, py+8);
            ctx.moveTo(px+14, py+3); ctx.lineTo(px+11, py+9);
            ctx.moveTo(px+5, py+14); ctx.lineTo(px+10, py+18);
            ctx.stroke();
          }
          ctx.fillStyle = a.fg;
          ctx.font = `bold ${Math.floor(TILE * 0.52)}px monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(a.label, px + TILE/2, py + TILE/2);
          if (cell.asset_id === 'objective' && cell.params?.data !== undefined) {
            ctx.fillStyle = '#cc88ff';
            ctx.font = 'bold 8px monospace';
            ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.fillText(cell.params.data, px + TILE - 2, py + 2);
          }
        }
      }

      ctx.strokeStyle = gridLine; ctx.lineWidth = 0.5;
      ctx.strokeRect(px + 0.25, py + 0.25, TILE - 0.5, TILE - 0.5);
    }
  }

  if (hoverCell && activeTool !== 'pick') {
    const { x, y } = hoverCell;
    ctx.strokeStyle = activeTool === 'erase' ? '#ff4444' : '#44aaff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x*TILE+1, y*TILE+1, TILE-2, TILE-2);
  }
}

function getCellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width) / TILE);
  const cy = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height) / TILE);
  if (cx >= 0 && cx < gridW && cy >= 0 && cy < gridH) return { x: cx, y: cy };
  return null;
}

function makeCell(assetId) {
  const cell = { asset_id: assetId };
  if (assetId === 'objective') cell.params = { data: objectiveDataValue };
  return cell;
}

function applyTool(cell) {
  if (!cell) return;
  const k = cellKey(cell.x, cell.y);
  if (activeTool === 'draw') { cells[k] = makeCell(selectedAsset); updateCount(); }
  else if (activeTool === 'erase') { delete cells[k]; updateCount(); }
  else if (activeTool === 'pick' && cells[k]) { selectedAsset = cells[k].asset_id; updateAssetUI(); }
}

function floodFill(startX, startY) {
  const startKey = cellKey(startX, startY);
  const startId = cells[startKey]?.asset_id ?? null;
  if (startId === selectedAsset) return;
  const queue = [{ x: startX, y: startY }];
  const visited = new Set([startKey]);
  while (queue.length) {
    const { x, y } = queue.shift();
    const k = cellKey(x, y);
    if ((cells[k]?.asset_id ?? null) !== startId) continue;
    cells[k] = makeCell(selectedAsset);
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx=x+dx, ny=y+dy;
      if (nx<0||nx>=gridW||ny<0||ny>=gridH) continue;
      const nk=cellKey(nx,ny);
      if (!visited.has(nk)) { visited.add(nk); queue.push({x:nx,y:ny}); }
    }
  }
  updateCount();
}

canvas.addEventListener('mousedown', e => {
  const cell = getCellFromEvent(e); if (!cell) return;
  isPainting = true;
  if (activeTool === 'fill') { floodFill(cell.x, cell.y); draw(); }
  else { applyTool(cell); draw(); }
});
canvas.addEventListener('mousemove', e => {
  const cell = getCellFromEvent(e);
  hoverCell = cell;
  if (isPainting && activeTool !== 'fill' && activeTool !== 'pick') applyTool(cell);
  draw();
  if (cell) document.getElementById('status-pos').innerHTML =
    `<i class="ti ti-map-pin" style="font-size:13px" aria-hidden="true"></i> ${cell.x}, ${cell.y}`;
});
canvas.addEventListener('mouseup', () => { isPainting = false; });
canvas.addEventListener('mouseleave', () => { isPainting = false; hoverCell = null; draw(); });

function updateCount() {
  const n = Object.keys(cells).length;
  document.getElementById('status-count').innerHTML =
    `<i class="ti ti-stack" style="font-size:13px" aria-hidden="true"></i> ${n} object${n!==1?'s':''}`;
}

function updateAssetUI() {
  document.querySelectorAll('.asset-btn').forEach(b =>
    b.classList.toggle('selected', b.dataset.id === selectedAsset));
  document.getElementById('status-asset').innerHTML =
    `<i class="ti ti-box" style="font-size:13px" aria-hidden="true"></i> ${selectedAsset}`;
  document.getElementById('prop-panel').classList.toggle('visible', selectedAsset === 'objective');
}

function updateToolUI() {
  const labels = {
    draw: 'PN',
    erase: 'ER',
    fill: 'FI',
    pick: 'EY'
  };
  document.querySelectorAll('.tool-btn').forEach(b =>
    b.classList.toggle('selected', b.id === `tool-${activeTool}`)
  );
  document.getElementById('status-tool').textContent = labels[activeTool];
}

document.querySelectorAll('.asset-btn').forEach(b => b.addEventListener('click', () => {
  selectedAsset = b.dataset.id;
  if (activeTool === 'erase') { activeTool = 'draw'; updateToolUI(); }
  updateAssetUI();
}));
['draw','erase','fill','pick'].forEach(t =>
  document.getElementById(`tool-${t}`).addEventListener('click', () => { activeTool=t; updateToolUI(); }));

document.getElementById('prop-data').addEventListener('input', e => {
  objectiveDataValue = parseInt(e.target.value) || 0;
});

document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='1') { activeTool='draw'; updateToolUI(); }
  if (e.key==='2') { activeTool='erase'; updateToolUI(); }
  if (e.key==='3') { activeTool='fill'; updateToolUI(); }
  if (e.key==='4') { activeTool='pick'; updateToolUI(); }
});

document.getElementById('btn-resize').addEventListener('click', () => {
  const nw=parseInt(document.getElementById('grid-w').value);
  const nh=parseInt(document.getElementById('grid-h').value);
  if (isNaN(nw)||isNaN(nh)||nw<4||nh<4) return;
  const nc={};
  for (const k in cells) { const [x,y]=k.split(',').map(Number); if(x<nw&&y<nh) nc[k]=cells[k]; }
  gridW=nw; gridH=nh; cells=nc;
  initCanvas(); updateCount();
});

document.getElementById('btn-clear').addEventListener('click', () => { cells={}; draw(); updateCount(); });

function getLevelJSON() {
  const name = document.getElementById('level-name').value || 'level_01';
  const objects = Object.entries(cells).map(([k, c]) => {
    const [x,y] = k.split(',').map(Number);
    const obj = { asset_id: c.asset_id, x, y };
    if (c.params) obj.params = c.params;
    return obj;
  });
  return JSON.stringify({ level_name: name, grid_width: gridW, grid_height: gridH, objects }, null, 2);
}

document.getElementById('btn-export').addEventListener('click', () => {
  document.getElementById('export-text').value = getLevelJSON();
  document.getElementById('modal-export').style.display = 'block';
});
document.getElementById('btn-export-close').addEventListener('click', () => {
  document.getElementById('modal-export').style.display = 'none';
});
document.getElementById('btn-copy-json').addEventListener('click', () => {
  document.getElementById('export-text').select();
  document.execCommand('copy');
  document.getElementById('btn-copy-json').innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
  setTimeout(() => { document.getElementById('btn-copy-json').innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy'; }, 1500);
});
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-text').value = '';
  document.getElementById('import-error').textContent = '';
  document.getElementById('modal-import').style.display = 'block';
});
document.getElementById('btn-import-cancel').addEventListener('click', () => {
  document.getElementById('modal-import').style.display = 'none';
});
document.getElementById('btn-import-load').addEventListener('click', () => {
  const errEl = document.getElementById('import-error');
  errEl.textContent = '';
  try {
    const data = JSON.parse(document.getElementById('import-text').value);
    if (!data.objects||!Array.isArray(data.objects)) throw new Error('Missing "objects" array');
    if (data.grid_width) gridW=data.grid_width;
    if (data.grid_height) gridH=data.grid_height;
    if (data.level_name) document.getElementById('level-name').value=data.level_name;
    document.getElementById('grid-w').value=gridW;
    document.getElementById('grid-h').value=gridH;
    cells={};
    for (const obj of data.objects) {
      if (obj.x>=0&&obj.x<gridW&&obj.y>=0&&obj.y<gridH&&obj.asset_id) {
        const cell={asset_id:obj.asset_id};
        if (obj.params) cell.params=obj.params;
        cells[cellKey(obj.x,obj.y)]=cell;
      }
    }
    initCanvas(); updateCount();
    document.getElementById('modal-import').style.display='none';
  } catch(err) { errEl.textContent='Parse error: '+err.message; }
});

initCanvas(); updateCount();
</script>
